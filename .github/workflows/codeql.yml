name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # The bundle is generated, and jquery is vendored; scanning either
          # produces findings nobody can act on.
          config: |
            paths-ignore:
              - dist/js/bundle.js
              - node_modules

      - uses: github/codeql-action/analyze@v3
