name: Stale

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 90
          days-before-close: 14
          # An idea nobody has got to is not stale, and a showcase never is.
          exempt-issue-labels: enhancement,showcase,pinned
          exempt-pr-labels: pinned
          stale-issue-message: >
            No activity here for three months. If it still happens, say so and
            this stays open; otherwise it closes in two weeks.
          stale-pr-message: >
            No activity here for three months. Comment if you are still on it,
            otherwise this closes in two weeks — reopening is cheap.
          close-issue-message: >
            Closing as stale. Reopen or comment if it is still live.
          close-pr-message: >
            Closing as stale. Reopen if you come back to it.
